name: Verify Expo companion

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/content.json', 'scripts/sync-content.mjs', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'src/content.json', 'scripts/sync-content.mjs', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node ../scripts/sync-content.mjs --check
      - run: pnpm lint && pnpm typecheck
      - run: pnpm export --platform all
