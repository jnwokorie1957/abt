# This file is loaded in Nginx's http context (conf.d/default.conf).
limit_req_zone $binary_remote_addr zone=abt_join:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/join {
        limit_req zone=abt_join burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://api:8080;
        access_log off;
    }
    location /api/ { return 404; }
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /media/ {
        expires 1d;
        try_files $uri =404;
    }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri =404; }
    location ~ /\. { deny all; }
}
